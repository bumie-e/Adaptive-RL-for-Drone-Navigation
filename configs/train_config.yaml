backend: pybullet     # switch to "isaac" when migrating

algorithm: PPO
device: cuda          # GPU training for the policy network
n_envs: 8             # parallel CPU envs feeding one GPU policy

total_timesteps: 5_000_000

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: tanh

logging:
  log_dir: runs/
  model_dir: models/
  save_freq: 100_000
  eval_freq: 25_000
  n_eval_episodes: 10
  use_wandb: false
  wandb_project: drone-waste-nav
